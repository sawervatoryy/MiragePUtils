# ============================================================
#  MiragePUtils — надстройка над LiteBans для Paper 1.21.4+
#  Студия: MirageStudio | Автор: sawervatoryy
#  Discord: https://discord.gg/dWPenZegK
#  Палитра: &f (белый) + &c (красный)
#
#  Плагин НЕ хранит баны и муты — их выдаёт и хранит LiteBans.
#  MiragePUtils показывает меню причин, считает «лесенку»,
#  проигрывает анимацию и запускает нужную команду LiteBans.
# ============================================================

# --- Журнал MiragePUtils (для лесенки и /phistory) ---------
database:
  type: sqlite              # sqlite | mysql
  sqlite-file: punishments.db
  mysql:
    host: localhost
    port: 3306
    database: mirageputils
    user: root
    password: ""

# --- Интеграция с LiteBans ---------------------------------
litebans:
  # staff   — команда выполняется от имени модератора (в LiteBans он будет указан как «выдавший»)
  # console — команда выполняется от имени консоли
  execute-as: staff
  check-permissions: true    # перед анимацией проверять право litebans.<команда> у модератора
  check-exempt: true         # не запускать анимацию для игроков с litebans.exempt.<тип>
  silent-flag: "-s"          # флаг тихого наказания в LiteBans
  # Шаблоны команд. Плейсхолдеры: {player} {duration} {reason} {silent}
  commands:
    ban: "ban {silent}{player} {reason}"
    tempban: "tempban {silent}{player} {duration} {reason}"
    ipban: "ipban {silent}{player} {reason}"
    tempipban: "tempipban {silent}{player} {duration} {reason}"
    mute: "mute {silent}{player} {reason}"
    tempmute: "tempmute {silent}{player} {duration} {reason}"
    warn: "warn {silent}{player} {reason}"
    tempwarn: "tempwarn {silent}{player} {duration} {reason}"
    kick: "kick {silent}{player} {reason}"

# --- Анимации наказаний ------------------------------------
# Игрока поднимает в воздух, вокруг него эффекты, затем вспышка, взрыв и молния —
# и только после этого выполняется наказание.
# Типы: ASCENSION (взлёт), STORM (шторм), VORTEX (вихрь), SILENCE (тишина), WARNING (вспышка), NONE
# Анимацию можно задать и для отдельной причины (animation: ... внутри reason).
animations:
  enabled: true
  by-type:
    BAN: ASCENSION
    IPBAN: VORTEX
    MUTE: SILENCE
    WARN: WARNING
    KICK: STORM

# --- Общие настройки ---------------------------------------
settings:
  date-format: "dd.MM.yyyy HH:mm"
  timezone: system             # system или, например, Europe/Moscow

# --- Предупреждения ----------------------------------------
warns:
  default-duration: 30d   # срок для шагов WARN в лесенке без срока (perm — навсегда, будет /warn вместо /tempwarn)

# --- Discord webhook ---------------------------------------
webhook:
  enabled: false
  url: "https://discord.com/api/webhooks/YOUR_WEBHOOK"
  username: "MiragePUtils"

# ============================================================
#  Шаблоны причин для /punish — «умная лесенка»
