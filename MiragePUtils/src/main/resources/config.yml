#  прошлых (не снятых) наказаний игрока по ЭТОЙ причине.
#  Последний шаг повторяется, если нарушений больше, чем шагов.
#  Формат шага: "ТИП СРОК" (для WARN срок необязателен, для KICK не нужен)
#  Сроки: 30s 15m 12h 7d 2w 1mo 1y 1d12h perm
# ============================================================
